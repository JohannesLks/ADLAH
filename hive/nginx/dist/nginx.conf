events {}

http {
  # Rate-Limit Zone (OK)
  limit_req_zone $binary_remote_addr zone=kibana_login:10m rate=5r/m;

  # Upgrade-Header sauber mappen (WS/SSE)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80 default_server;
    server_name adlah.dev;
    return 301 https://adlah.dev$request_uri;
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adlah.dev;

    # --- TLS / Security (wie gehabt, leicht gestrafft) ---
    ssl_certificate           /etc/nginx/certs/cert.pem;
    ssl_certificate_key       /etc/nginx/certs/key.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;

    # KEIN globales limit_req hier!

    # Basic Auth global (ok)
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Health ohne Auth
    location ^~ /health {
      auth_basic off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # --- Login-Endpunkte: HIER rate-limiten ---
    location = /internal/security/login {
      limit_req zone=kibana_login burst=20 nodelay;
      proxy_pass http://kibana:5601;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
    }
    location = /api/security/login {
      limit_req zone=kibana_login burst=20 nodelay;
      proxy_pass http://kibana:5601;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
    }

    # --- Standard-Proxy für alles andere (Assets, App, APIs) ---
    location / {
      proxy_pass http://kibana:5601;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket/SSE robust
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      # optional: proxy_buffering off;  # für lange Streams/SSE
    }
  }
}
