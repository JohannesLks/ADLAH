name: Deploy to Hive via Bastion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: hive-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Validate SSH Secrets
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo " Error: VM_HOST secret is not set"; exit 1; fi
          if [ -z "${{ secrets.VM_USER }}" ]; then
            echo " Error: VM_USER secret is not set"; exit 1; fi
          if [ -z "${{ secrets.BASTION_HOST }}" ]; then
            echo " Error: BASTION_HOST secret is not set"; exit 1; fi
          if [ -z "${{ secrets.BASTION_USER }}" ]; then
            echo " Error: BASTION_USER secret is not set"; exit 1; fi
          if [ -z "${{ secrets.BASTION_SSH_PRIVATE_KEY }}" ]; then
            echo " Error: BASTION_SSH_PRIVATE_KEY secret is not set"; exit 1; fi
          if [ -z "${{ secrets.VM_SSH_PRIVATE_KEY }}" ]; then
            echo " Error: VM_SSH_PRIVATE_KEY secret is not set"; exit 1; fi
          echo " All SSH secrets are configured"

      - name: Setup SSH Keys and Configuration
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Private keys
          printf '%s\n' "${{ secrets.BASTION_SSH_PRIVATE_KEY }}" > ~/.ssh/bastion_key
          chmod 600 ~/.ssh/bastion_key
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          
          # SSH config
          cat > ~/.ssh/config <<'EOF'
          Host bastion
            HostName ${BASTION_HOST}
            User ${BASTION_USER}
            IdentityFile ~/.ssh/bastion_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PasswordAuthentication no
            PubkeyAuthentication yes
            IdentitiesOnly yes
            ConnectTimeout 30
            ServerAliveInterval 60
            ServerAliveCountMax 3
          
          Host hive
            HostName ${VM_HOST}
            User ${VM_USER}
            IdentityFile ~/.ssh/vm_key
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PasswordAuthentication no
            PubkeyAuthentication yes
            IdentitiesOnly yes
            ConnectTimeout 60
            ServerAliveInterval 60
            ServerAliveCountMax 3
          EOF
          # Variablen in Config ersetzen
          sed -i "s|\${BASTION_HOST}|${{ secrets.BASTION_HOST }}|g" ~/.ssh/config
          sed -i "s|\${BASTION_USER}|${{ secrets.BASTION_USER }}|g" ~/.ssh/config
          sed -i "s|\${VM_HOST}|${{ secrets.VM_HOST }}|g" ~/.ssh/config
          sed -i "s|\${VM_USER}|${{ secrets.VM_USER }}|g" ~/.ssh/config
          chmod 600 ~/.ssh/config
          
          # Quick connectivity checks
          echo "Testing bastion connection..."
          ssh -o BatchMode=yes bastion "echo 'Bastion connection successful'"
          echo "Testing hive connection via bastion..."
          ssh -o BatchMode=yes hive "echo 'hive connection successful'"

      - name: Create dynamic inventory
        run: |
          {
            echo "[hive]"
            echo "hive ansible_host=hive ansible_user=${{ secrets.VM_USER }} ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes'"
          } > inventory.ini
          echo "Inventory created:"
          cat inventory.ini

      - name: Run Ansible Playbook
        env:
          KIBANA_ADMIN_PASS: ${{ secrets.KIBANA_ADMIN_PASS }}
          GRAFANA_PASS: ${{ secrets.GRAFANA_PASS }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          CLUSTER_IP: ${{ secrets.VM_HOST }}
          CLUSTER_USER: ${{ secrets.VM_USER }}
        run: |
          echo "Testing SSH connection to hive via bastion..."
          ssh -o BatchMode=yes hive "echo 'hive connection successful'"
          
          ansible-playbook -i inventory.ini deploy/deploy_hive.yml \
            --extra-vars "kibana_admin_pass=$KIBANA_ADMIN_PASS grafana_pass=$GRAFANA_PASS git_branch=$GIT_BRANCH cluster_ip=$CLUSTER_IP cluster_user=$CLUSTER_USER"
