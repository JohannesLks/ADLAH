name: trivy

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 23 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (repo)
        uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload SARIF (FS)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: nginx,                 dockerfile: 'nginx/Dockerfile',                     context: 'nginx' }
          - { name: hive-elasticsearch,    dockerfile: 'hive/elasticsearch/dist/Dockerfile',  context: 'hive/elasticsearch/dist' }
          - { name: hive-kibana,           dockerfile: 'hive/kibana/dist/Dockerfile',         context: 'hive/kibana/dist' }
          - { name: hive-logstash,         dockerfile: 'hive/logstash/dist/Dockerfile',       context: 'hive/logstash/dist' }
          - { name: filebeat,              dockerfile: 'sensor/filebeat/dist/Dockerfile',     context: 'sensor/filebeat/dist' }
          - { name: madcat,                dockerfile: 'sensor/madcat/dist/Dockerfile',       context: 'sensor/madcat/dist' }
          - { name: rl-agent,              dockerfile: 'rl-agent/Dockerfile',                  context: 'rl-agent' }
          - { name: rl-agent-filebeat,     dockerfile: 'rl-agent-filebeat/Dockerfile',         context: 'rl-agent-filebeat' }
          - { name: redirector-agent,      dockerfile: 'redirector-agent/Dockerfile',          context: 'redirector-agent' }
          # Falls gewünscht:
          # - { name: rl-agent-sim,       dockerfile: 'rl-agent/Dockerfile.sim',              context: 'rl-agent' }
          # - { name: k8s-orchestrator,   dockerfile: 'orchestrator/Dockerfile',              context: 'orchestrator' }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }}
        run: |
          docker build \
            -t local/${{ matrix.image.name }}:${{ github.sha }} \
            -f ${{ matrix.image.dockerfile }} \
            ${{ matrix.image.context }}

      - name: Trivy scan ${{ matrix.image.name }}
        uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
        with:
          image-ref: local/${{ matrix.image.name }}:${{ github.sha }}
          format: 'sarif'
          output: trivy-${{ matrix.image.name }}.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
